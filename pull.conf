#!/usr/bin/env bash
# Configuration for dojo-pull-tool
# All values can be overridden via environment variables (used by the Docker image).

SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

DOJO_USER="${DOJO_USER:-hacker}"
SSH_HOST="${SSH_HOST:-dojo.pwn.college}"
KEY_PATH="${KEY_PATH:-$HOME/.ssh/id_ed25519}"

# Default output directory: <tool dir>/outputs
OUT_DIR="${OUT_DIR:-$SCRIPT_DIR/outputs}"
